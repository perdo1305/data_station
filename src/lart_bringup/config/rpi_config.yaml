# ROS 2 parameter YAML for all LART dashboard nodes.
# Load with: parameters=[config] in a launch Node() action.
#
# !! UPDATE rpm_can_id to match your car's CAN DBC !!

can_bridge_can0:
  ros__parameters:
    can_interface: can0          # data bus; configure SocketCAN at 1000000 bit/s
    rpm_can_id: 291              # 0x123 — UPDATE to your ECU's RPM message ID
    rpm_start_byte: 0            # byte offset of RPM value inside the CAN frame
    rpm_length_bytes: 2          # number of bytes (big-endian unsigned)
    rpm_scale: 1.0               # raw_value * scale + offset = RPM
    rpm_offset: 0.0
    # DBC-based dynamic decoding.
    # can0 carries the data bus — load ONLY data_t26.dbc here. Do not point
    # this at the dbc_signals/ directory: powertrain_t26.dbc shares arbitration
    # IDs 0x444/0x445/0x750 with different signal layouts, and loading both
    # DBCs into one bridge silently decodes data-bus frames with the wrong
    # (powertrain) layout.
    dbc_path: "/home/lart2026/GIT/data_station/dbc_signals/data_t26.dbc"

can_bridge_can1:
  ros__parameters:
    can_interface: can1          # powertrain bus; configure SocketCAN at 500000 bit/s
    rpm_can_id: 291              # 0x123 — UPDATE to your ECU's RPM message ID
    rpm_start_byte: 0            # byte offset of RPM value inside the CAN frame
    rpm_length_bytes: 2          # number of bytes (big-endian unsigned)
    rpm_scale: 1.0               # raw_value * scale + offset = RPM
    rpm_offset: 0.0
    # DBC-based dynamic decoding.
    # can1 carries the powertrain bus — load ONLY powertrain_t26.dbc here.
    # See can_bridge_can0 comment: never load both DBCs into the same bridge.
    dbc_path: "/home/lart2026/GIT/data_station/dbc_signals/powertrain_t26.dbc"

dashboard_state_bridge:
  ros__parameters:
    publish_hz: 20.0
    can_active_timeout_s: 1.0
    # If speed_topic is empty, speed can be derived from RPM:
    # speed_kph = rpm * speed_from_rpm_scale
    speed_scale: 1.0
    speed_from_rpm_scale: 0.02454
    # Topic mapping (empty string disables that input)
    rpm_topic: /vehicle/rpm
    speed_topic: ""         # e.g. /can/dv_dynamics_1/speed_actual
    inv_temp_topic: ""      # e.g. /pwt/inv1_temperatures/inv1_actual_tempcontroller
    motor_temp_topic: ""    # e.g. /pwt/inv1_temperatures/inv1_actual_tempmotor
    bps_topic: ""           # e.g. /can/dv_dynamics_1/brake_hydr_actual
    kw_inst_topic: ""
    kw_limit_topic: ""
    soc_lv_topic: ""
    soc_hv_topic: /pwt/master_soc_accumulator/soc_float
    lv_voltage_topic: /data/pdm_lv/lv_voltage_mv
    r2d_ready_topic: ""     # e.g. /pwt/dashboard/ready_to_drive

input_handler:
  ros__parameters:
    # Pull-ups are on, wire every switch/encoder common to GND. Do NOT use GPIO 8-11, 13, 16-22:
    # the SPI0/SPI1 + MCP2515 CAN overlays in config.txt own them.
    # ui_runner (autostart) reads GPIO26 itself to change screens (kOkButtonLine in ui_runner.cpp),
    # so this node and ui_runner cannot run at the same time: the second one to start finds the line busy.
    button_a: 26                 # OK   (right steering button) — was on GPIO17 (SPI1 CS, busy): move wire to GPIO26
    button_b: 27                 # NEXT (left steering button)
    encoder_a_clk: 24            # encoder A = right steering encoder
    encoder_a_dt: 5
    encoder_b_clk: 25            # encoder B = left steering encoder
    encoder_b_dt: 23
    debounce_ms: 50
    encoder_debounce_us: 2000    # raise if an encoder still jitters, lower if it misses fast turns
    encoder_steps_per_detent: 4  # 4 for most encoders, 2 if one click only gives half the expected count
    encoder_reverse: false       # true flips CW/CCW
    sim_mode: false              # set true in sim launch to skip GPIO init

led_controller:
  ros__parameters:
    led_count: 16
    # NeoPixel data uses SPI0 MOSI: GPIO 10, physical pin 19.
    brightness: 0.15             # 0.0-1.0; low brightness for cockpit use
    animation_hz: 20.0           # relative-current gauge refresh rate

mock_can:
  ros__parameters:
    rpm_can_id: 291              # must match can_bridge.rpm_can_id
    rpm_idle: 1000.0
    rpm_max: 12500.0
    rpm_shift: 11500.0
    sweep_period_s: 5.0
    publish_hz: 100.0

can_simulator:
  ros__parameters:
    can_interface: vcan0    # virtual CAN interface created at startup
    # dbc_path is set to the resolved absolute path by dbc_sim.launch.py
    dbc_path: ""
    publish_hz: 10.0        # frames per second per message (round-robin)
    message_ids: []         # empty = all messages in DBC

dashboard_ui:
  ros__parameters:
    rpm_shift: 11500
    rpm_max: 12000

bag_recorder:
  ros__parameters:
    trigger_topic: /pwt/start_precharge
    as_state_topic: /can/jetson  # lart_msgs/Jetson; also records while as_state == 2 (READY)
    # Records all discoverable ROS topics, including hidden topics and /can/frames,
    # except topics under /zed/.
    bag_dir: "~/bags"            # session folders precharge_/autonomous_YYYY-MM-DDTHH-MM-SS
    stop_grace_s: 30.0           # keep recording this long after request=0
    split_duration_s: 0          # 0 = single continuous file per session (no splitting)
