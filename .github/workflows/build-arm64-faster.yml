name: faster build

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: build-arm64-faster
  cancel-in-progress: true

jobs:
  faster:
    name: faster build
    runs-on: ubuntu-24.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add ROS2 apt repository
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-arm64-jazzy-${{ hashFiles('.github/workflows/build-arm64-faster.yml') }}

      - name: Install ROS2 and build tooling
        run: |
          sudo apt-get install -y \
            ros-jazzy-ros-base \
            ros-jazzy-rclcpp \
            ros-jazzy-rclpy \
            ros-jazzy-std-msgs \
            ros-jazzy-rosidl-default-generators \
            ros-jazzy-rosidl-default-runtime \
            python3-colcon-common-extensions \
            build-essential \
            ccache \
            cmake \
            pkg-config \
            libsdl2-dev
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            install
            log
            LART_Car_Dashboard_v1/build/ui-build
            .ccache
          key: faster-arm64-${{ hashFiles('src/**', 'LART_Car_Dashboard_v1/src/**', '.github/workflows/build-arm64-faster.yml') }}
          restore-keys: |
            faster-arm64-

      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=1G
          ccache --zero-stats

      - name: Build ROS2 workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --parallel-workers $(nproc) \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build dashboard UI
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          cmake -S LART_Car_Dashboard_v1/src/ui \
            -B LART_Car_Dashboard_v1/build/ui-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build LART_Car_Dashboard_v1/build/ui-build --parallel $(nproc)
          cmake --install LART_Car_Dashboard_v1/build/ui-build

      - name: Show compiler cache statistics
        run: ccache --show-stats

      - name: Save build cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build
            install
            log
            LART_Car_Dashboard_v1/build/ui-build
            .ccache
          key: faster-arm64-${{ hashFiles('src/**', 'LART_Car_Dashboard_v1/src/**', '.github/workflows/build-arm64-faster.yml') }}

      - name: Package artifact
        run: |
          find install -type f -name '*.a' -delete
          tar czf fast-lart-dashboard-arm64.tar.gz install

      - name: Get short commit SHA
        id: version
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: faster-arm64-${{ github.sha }}
          name: "Fast ARM64 build ${{ steps.version.outputs.short_sha }}"
          files: fast-lart-dashboard-arm64.tar.gz

      - name: Update latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: faster-arm64
          name: "Latest ARM64 build - faster"
          files: fast-lart-dashboard-arm64.tar.gz
